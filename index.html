<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function () {
        var pathname = window.location.pathname || '/';
        var basePath = '/';
        if (pathname === '/onze' || pathname.indexOf('/onze/') === 0) {
          basePath = '/onze/';
          if (pathname === '/onze') {
            window.history.replaceState(null, '', '/onze/' + window.location.search + window.location.hash);
          }
        }
        var base = document.createElement('base');
        base.href = basePath;
        document.head.appendChild(base);
      })();
    </script>
    <title>ONZE LOUNGE | Experiência Premium</title>
    <meta name="description" content="Cardápios oficiais, horários de funcionamento e localização da ONZE LOUNGE em Goiânia." />
    
    <!-- Favicon & Ícone de App -->
    <link rel="icon" type="image/png" href="./assets/aistudio/onze_natl_logo_cddfaa94.png" />
    <link rel="apple-touch-icon" href="./assets/aistudio/onze_natl_logo_cddfaa94.png" />
    <!-- Preload prioritário da logo oficial para eliminar piscadas de renderização -->
    <link rel="preload" as="image" href="./assets/aistudio/onze_natl_logo_cddfaa94.png" type="image/png" fetchpriority="high" />
    
    <!-- Metadados de Compartilhamento (WhatsApp, Instagram, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ONZE LOUNGE" />
    <meta property="og:title" content="ONZE LOUNGE | Experiência Premium" />
    <meta property="og:description" content="Cardápios oficiais, horários de funcionamento e localização da ONZE LOUNGE em Goiânia." />
    <meta property="og:image" content="./assets/aistudio/onze_natl_logo_cddfaa94.png" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONZE LOUNGE | Experiência Premium" />
    <meta name="twitter:description" content="Cardápios oficiais, horários de funcionamento e localização da ONZE LOUNGE em Goiânia." />
    <meta name="twitter:image" content="./assets/aistudio/onze_natl_logo_cddfaa94.png" />
    
    <meta name="theme-color" content="#080808" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#080808] text-[#F5F3EF] antialiased selection:bg-[#C6A36A]/30 selection:text-[#E0C49A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
